name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config

  dbt-airflow-check:
    runs-on: ubuntu-latest
    needs: compose-config
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow image
        run: docker compose build airflow-init
      - name: Start PostgreSQL
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U dw_user -d warehouse && exit 0
            sleep 2
          done
          exit 1
      - name: Generate source data
        run: docker compose run --rm --entrypoint python3 airflow-init /opt/airflow/data_generator/generate_data.py
      - name: Initialize Airflow database
        run: docker compose run --rm --entrypoint /home/airflow/.local/bin/airflow airflow-init db migrate
      - name: Create Airflow admin user
        run: docker compose run --rm --entrypoint /home/airflow/.local/bin/airflow airflow-init users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      - name: Check dbt installation and connection
        run: docker compose run --rm --entrypoint /home/airflow/.local/bin/dbt airflow-init debug --project-dir /opt/airflow/dbt_project --profiles-dir /opt/airflow/dbt_project --log-path /tmp/dbt-logs
      - name: Validate dbt project
        run: docker compose run --rm --entrypoint /home/airflow/.local/bin/dbt airflow-init parse --project-dir /opt/airflow/dbt_project --profiles-dir /opt/airflow/dbt_project --log-path /tmp/dbt-logs
      - name: Run dbt
        run: docker compose run --rm --entrypoint /home/airflow/.local/bin/dbt airflow-init run --project-dir /opt/airflow/dbt_project --profiles-dir /opt/airflow/dbt_project --log-path /tmp/dbt-logs
      - name: Test dbt
        run: docker compose run --rm --entrypoint /home/airflow/.local/bin/dbt airflow-init test --project-dir /opt/airflow/dbt_project --profiles-dir /opt/airflow/dbt_project --log-path /tmp/dbt-logs
      - name: Tear down
        if: always()
        run: docker compose down -v
