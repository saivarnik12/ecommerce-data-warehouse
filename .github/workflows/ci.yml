name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config

  dbt-airflow-check:
    runs-on: ubuntu-latest
    needs: compose-config
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow image
        run: docker compose build airflow-init
      - name: Start PostgreSQL
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U dw_user -d warehouse && exit 0
            sleep 2
          done
          exit 1
      - name: Generate source data
        run: docker compose run --rm airflow-init bash -c '/usr/local/bin/python /opt/data-generator/generate_data.py'
      - name: Initialize Airflow
        run: docker compose run --rm airflow-init
      - name: Run dbt
        run: docker compose run --rm airflow-init bash -c 'cd /opt/dbt && /usr/local/bin/python -m dbt.cli.main run --profiles-dir .'
      - name: Test dbt
        run: docker compose run --rm airflow-init bash -c 'cd /opt/dbt && /usr/local/bin/python -m dbt.cli.main test --profiles-dir .'
      - name: Tear down
        if: always()
        run: docker compose down -v
