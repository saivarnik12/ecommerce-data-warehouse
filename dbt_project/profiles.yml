ecommerce_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      user: "{{ env_var('DB_USER', 'dw_user') }}"
      password: "{{ env_var('DB_PASSWORD', 'dw_password') }}"
      dbname: "{{ env_var('DB_NAME', 'warehouse') }}"
      schema: analytics
      threads: 4
