version: 2
models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        tests: [not_null]
      - name: price
        tests: [not_null]
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: {to: ref('dim_customers'), field: customer_id}
      - name: status
        tests:
          - accepted_values: {values: ['completed','shipped','cancelled']}
  - name: stg_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
  - name: stg_payments
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values: {values: ['paid']}
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]
  - name: dim_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        tests: [not_null]
  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]
      - name: year
        tests: [not_null]
  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: {to: ref('dim_customers'), field: customer_id}
      - name: order_value
        tests: [not_null]
  - name: fct_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships: {to: ref('fct_orders'), field: order_id}
      - name: product_id
        tests:
          - not_null
          - relationships: {to: ref('dim_products'), field: product_id}
  - name: daily_sales_summary
    columns:
      - name: order_date
        tests: [unique, not_null]
      - name: revenue
        tests: [not_null]
  - name: monthly_revenue_by_category
    columns:
      - name: month_start
        tests: [not_null]
      - name: category
        tests: [not_null]
  - name: customer_ltv
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: lifetime_value
        tests: [not_null]
